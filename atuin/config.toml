# atuin: searchable shell history on ⌃R, kept on this Mac only (no sync account).
# History lives in ~/.local/share/atuin. fzf keeps ⌃T, ⌥C and ⌃G.
auto_sync = false
update_check = false
style = "compact"
inline_height = 15
show_preview = true
enter_accept = false          # Return puts the command on the line; Return again runs it
filter_mode_shell_up_key_binding = "session"

[theme]
name = "current"   # themes/current.toml, written by `theme`
