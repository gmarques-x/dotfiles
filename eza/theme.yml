# eza colours, Nord.
colourful: true

filekinds:
  normal: {foreground: "#D8DEE9"}
  directory: {foreground: "#81A1C1", is_bold: true}
  symlink: {foreground: "#88C0D0"}
  pipe: {foreground: "#B48EAD"}
  block_device: {foreground: "#EBCB8B"}
  char_device: {foreground: "#EBCB8B"}
  socket: {foreground: "#B48EAD"}
  special: {foreground: "#D08770"}
  executable: {foreground: "#A3BE8C", is_bold: true}
  mount_point: {foreground: "#81A1C1", is_underline: true}

perms:
  user_read: {foreground: "#EBCB8B"}
  user_write: {foreground: "#BF616A"}
  user_execute_file: {foreground: "#A3BE8C"}
  user_execute_other: {foreground: "#A3BE8C"}
  group_read: {foreground: "#EBCB8B"}
  group_write: {foreground: "#BF616A"}
  group_execute: {foreground: "#A3BE8C"}
  other_read: {foreground: "#EBCB8B"}
  other_write: {foreground: "#BF616A"}
  other_execute: {foreground: "#A3BE8C"}
  special_user_file: {foreground: "#B48EAD"}
  special_other: {foreground: "#B48EAD"}
  attribute: {foreground: "#919CB3"}

size:
  major: {foreground: "#D8DEE9"}
  minor: {foreground: "#919CB3"}
  number_byte: {foreground: "#D8DEE9"}
  number_kilo: {foreground: "#D8DEE9"}
  number_mega: {foreground: "#D8DEE9"}
  number_giga: {foreground: "#D8DEE9"}
  number_huge: {foreground: "#D8DEE9"}
  unit_byte: {foreground: "#919CB3"}
  unit_kilo: {foreground: "#919CB3"}
  unit_mega: {foreground: "#919CB3"}
  unit_giga: {foreground: "#919CB3"}
  unit_huge: {foreground: "#919CB3"}

users:
  user_you: {foreground: "#D8DEE9"}
  user_root: {foreground: "#BF616A"}
  user_other: {foreground: "#919CB3"}
  group_yours: {foreground: "#D8DEE9"}
  group_other: {foreground: "#919CB3"}
  group_root: {foreground: "#BF616A"}

links:
  normal: {foreground: "#919CB3"}
  multi_link_file: {foreground: "#EBCB8B"}

git:
  new: {foreground: "#A3BE8C"}
  modified: {foreground: "#B48EAD"}
  deleted: {foreground: "#BF616A"}
  renamed: {foreground: "#88C0D0"}
  typechange: {foreground: "#B48EAD"}
  ignored: {foreground: "#616E88"}
  conflicted: {foreground: "#BF616A"}

git_repo:
  branch_main: {foreground: "#81A1C1"}
  branch_other: {foreground: "#B48EAD"}
  git_clean: {foreground: "#A3BE8C"}
  git_dirty: {foreground: "#BF616A"}

security_context:
  colon: {foreground: "#919CB3"}
  user: {foreground: "#D8DEE9"}
  role: {foreground: "#B48EAD"}
  typ: {foreground: "#616E88"}
  range: {foreground: "#B48EAD"}

file_type:
  image: {foreground: "#B48EAD"}
  video: {foreground: "#B48EAD"}
  music: {foreground: "#88C0D0"}
  lossless: {foreground: "#88C0D0"}
  crypto: {foreground: "#BF616A"}
  document: {foreground: "#D8DEE9"}
  compressed: {foreground: "#D08770"}
  temp: {foreground: "#616E88"}
  compiled: {foreground: "#616E88"}
  build: {foreground: "#EBCB8B"}
  source: {foreground: "#D8DEE9"}

punctuation: {foreground: "#919CB3"}
date: {foreground: "#88C0D0"}
inode: {foreground: "#919CB3"}
blocks: {foreground: "#919CB3"}
header: {foreground: "#D8DEE9", is_underline: true}
octal: {foreground: "#919CB3"}
flags: {foreground: "#B48EAD"}

symlink_path: {foreground: "#88C0D0"}
control_char: {foreground: "#BF616A"}
broken_symlink: {foreground: "#BF616A"}
broken_path_overlay: {foreground: "#BF616A", is_underline: true}
